services:
  pandachaika:
    build: .
    container_name: pandachaika
    restart: unless-stopped
    volumes:
      - ./config:/config/
      - ./media:/media/
      - ./static:/static/
    # Expose for access from Nginx
    # Ports to direct access to the backend (not recommended unless in dev)
    expose:
      - "8090"
#    ports:
#      - "8090:8090"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      WEBSERVER_BACKEND: ${WEBSERVER_BACKEND:-gunicorn}
      START_WORKER: ${START_WORKER:-auto}
      ELASTICSEARCH_ENABLE: ${ELASTICSEARCH_ENABLE:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200/}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: pandachaika_worker
    restart: unless-stopped
    command: worker
    volumes:
      - ./config:/config/
      - ./media:/media/
      - ./static:/static/
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG}
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      MODE: worker
      WORKER_ARGS: ${WORKER_ARGS:-}
      SKIP_MIGRATIONS: ${WORKER_SKIP_MIGRATIONS:-false}
      ELASTICSEARCH_ENABLE: ${ELASTICSEARCH_ENABLE:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200/}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: pandachaika_db
    command: -c 'max_connections=500'
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Uncomment ports if you need external access to the database
#   ports:
#     - "5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  elasticsearch:
    image: elasticsearch:8.18.1
    container_name: pandachaika_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m"
    expose:
      - "9200"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    profiles:
      - elasticsearch
      - full

  nginx:
    image: nginx:alpine
    container_name: pandachaika_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./media:/var/www/media/
      - ./static:/var/www/static/
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./certs:/etc/nginx/certs/
    depends_on:
      - pandachaika

volumes:
  postgres_data:
  elasticsearch_data:
#  static_volume:
#  media_volume:
