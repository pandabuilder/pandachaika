stages:
  - static-check
  - test
  - deploy
  - build

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHON_VERSION: "3.14"
  FF_TIMESTAMPS: true

# Skip the whole pipeline when the only changes are root docs/markdown files
# (e.g. CHANGELOG.md, README.md, TODO.md, LICENSE).
# `changes` doesn't support negated globs, so we list everything that should
# trigger a pipeline: every file inside a subdirectory, plus root-level files
# by extension/name. If you add a new root-level file with an unlisted
# extension, add it to the list below.
workflow:
  rules:
    # Manually started, scheduled, API-triggered and downstream pipelines always run.
    - if: $CI_PIPELINE_SOURCE =~ /^(web|schedule|api|trigger|pipeline|parent_pipeline)$/
    - changes:
        paths:
          - "*/**/*"
          - ".*"
          - "*.{py,toml,yml,yaml,lock,txt,sh,json,ini,cfg,env,xml}"
          - "Dockerfile"
    - when: never

cache: &global_cache
  key:
    files:
      - uv.lock
    prefix: "uv-$PYTHON_VERSION"
  fallback_keys:
    - "uv-$PYTHON_VERSION"
    - "uv"
  paths:
    - .cache/uv
    - .mypy_cache
    - .ruff_cache

static-analysis:
  stage: static-check
  image: astral/uv:python$PYTHON_VERSION-trixie
  cache:
    <<: *global_cache
  script:
    - python --version
    - uv sync --locked --active --group ci
    - uv run --no-sync ruff check --exclude=".venv" .
    - uv run --no-sync mypy --show-traceback core pandabackup viewer workers
    - uv cache prune --ci
  tags:
    - django
    - panda

test-all:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION:
        - '3.14'
        - '3.15'
  cache:
    <<: *global_cache
  image: astral/uv:python$PYTHON_VERSION-trixie
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: pandaweb
    POSTGRES_USER: pandaadmin
    POSTGRES_PASSWORD: pandaadmin
    DATABASE_ENGINE: postgresql
    DATABASE_NAME: pandaweb
    DATABASE_USERNAME: pandaadmin
    DATABASE_PASSWORD: pandaadmin
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DEBUG: "true"
    MEDIA_ROOT: /tmp/media/
    STATIC_ROOT: /tmp/static/
  script:
    - python --version
    - uv sync --locked --active --group ci --group dev
    # No `manage.py migrate` here: pytest-django creates and migrates its own
    # test_<DATABASE_NAME> database, so migrating the main DB was wasted work.
    - uv run --no-sync pytest --durations=20 --junitxml=test-results/TEST-pytest.xml
    - uv cache prune --ci
  tags:
    - django
    - panda
  artifacts:
    when: always
    paths:
      - test-results/TEST-*.xml
    reports:
      junit: test-results/TEST-*.xml

deploy-prod:
  stage: deploy
  image: alpine:3
  dependencies: []
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - install -m 600 "$PROD_DEPLOY_SSH_KEY" ~/.ssh/deploy_key
    - install -m 644 "$PROD_DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - >-
      ssh -T
      -i ~/.ssh/deploy_key
      -o IdentitiesOnly=yes
      -o BatchMode=yes
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile=~/.ssh/known_hosts
      "$PROD_DEPLOY_TARGET"
  tags:
    - django
    - panda

build-image:
  stage: build
  when: manual
  dependencies: []
  image:
    # Upstream gcr.io/kaniko-project was archived in June 2025; this is the maintained community fork.
    # Pinned so runners can reuse the cached image instead of re-pulling a moving tag.
    name: ghcr.io/osscontainertools/kaniko:v1.29.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    # Kaniko/Go looks in /kaniko/ssl/certs/ca-certificates.crt:
    - cat "$INTERNAL_CA_CERT" >> /kaniko/ssl/certs/ca-certificates.crt
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
#  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
