stages:
  - static-check
  - test
  - deploy
  - build

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHON_VERSION: "3.13"
  FF_TIMESTAMPS: true

cache: &global_cache
  key:
    files:
      - uv.lock
    prefix: "uv-$PYTHON_VERSION"
  fallback_keys:
    - "uv-$PYTHON_VERSION"
    - "uv"
  paths:
    - .cache/uv
    - .mypy_cache
    - .ruff_cache

static-analysis:
  stage: static-check
  image: astral/uv:python$PYTHON_VERSION-trixie
  cache:
    <<: *global_cache
  script:
    - python --version
    - uv sync --locked --active --group ci
    - uv run --no-sync ruff check --exclude=".venv" .
    - uv run --no-sync mypy --show-traceback core pandabackup viewer
    - uv cache prune --ci
  tags:
    - django
    - panda

test-all:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION:
        - '3.13'
        - '3.14'
        - '3.15'
  cache:
    <<: *global_cache
  image: astral/uv:python$PYTHON_VERSION-trixie
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: pandaweb
    POSTGRES_USER: pandaadmin
    POSTGRES_PASSWORD: pandaadmin
    DATABASE_ENGINE: postgresql
    DATABASE_NAME: pandaweb
    DATABASE_USERNAME: pandaadmin
    DATABASE_PASSWORD: pandaadmin
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DEBUG: "true"
    MEDIA_ROOT: /tmp/media/
    STATIC_ROOT: /tmp/static/
  script:
    - python --version
    - uv sync --locked --active --group ci
    - uv run --no-sync manage.py migrate
    - uv run --no-sync manage.py test --noinput viewer.tests.test_internal viewer.tests.test_core viewer.tests.test_registry_api
    - uv cache prune --ci
  tags:
    - django
    - panda
  artifacts:
    when: always
    paths:
      - test-results/TEST-*.xml
    reports:
      junit: test-results/TEST-*.xml

build:
  image: docker:29.9.2
  when: manual
  services:
    - docker:29.9.2-dind
  before_script:
    - docker info
  stage: build
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
