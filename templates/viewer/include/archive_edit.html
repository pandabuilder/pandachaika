<form action="" method="POST">
  {% csrf_token %}
  <div id="change-archive-form" class="collapse mb-3">
    <div class="card bg-dark border-secondary shadow-sm">
      <div class="card-header bg-dark border-secondary py-2">
        <span class="card-field-title"><i class="fas fa-edit me-1"></i>Edit Archive</span>
      </div>
      <div class="card-body p-3 text-light">
        <div class="table-responsive">
          <table class="table table-dark table-sm mb-3">
            {{ edit_form }}
          </table>
        </div>
        <button type="submit" name="change-archive" value="Submit" class="btn btn-primary btn-sm">
          <i class="fas fa-save me-1"></i>Submit Changes
        </button>
      </div>
    </div>
  </div>
</form>
