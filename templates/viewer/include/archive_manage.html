<form action="" method="POST">
  {% csrf_token %}
  <div id="manage-archive-form" class="collapse mb-3">
    <div class="card bg-dark border-secondary shadow-sm">
      <div class="card-header bg-dark border-secondary py-2">
        <span class="card-field-title"><i class="fas fa-bookmark me-1"></i>Manage Archive</span>
      </div>
      <div class="card-body p-3 text-light">
        {% if archive_manage_formset %}
          <div class="table-responsive">
            <table class="table table-dark table-sm mb-3">
              {{ archive_manage_formset }}
            </table>
          </div>
        {% endif %}
        <button type="submit" name="manage-archive" value="Submit" class="btn btn-primary btn-sm">
          <i class="fas fa-save me-1"></i>Submit
        </button>
      </div>
    </div>
  </div>
</form>
