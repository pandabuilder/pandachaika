{% load static compress %}
{% compress css %}
  <link href="{% static 'css/dm-pages.css' %}" type="text/css" rel="stylesheet" />
{% endcompress %}
<style>
  :root {
    --rs-present: #1d6b3c;
    --rs-present-border: #2fa35a;
    --rs-extra: #14595f;
    --rs-extra-border: #22a3ad;
    --rs-gallery-only: #4a2a6b;
    --rs-gallery-only-border: #a974e3;
    --rs-missing: #6e1d2b;
    --rs-missing-border: #e35d6a;
    --rs-due: #6b5714;
    --rs-due-border: #ffc107;
    --rs-dismissed: #2c3646;
  }
  .rs-grid { display: flex; flex-direction: column; gap: 3px; }
  .rs-row { display: flex; align-items: flex-start; gap: 6px; }
  .rs-row-label {
    flex: 0 0 3.4rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--pg-text-secondary);
    line-height: 1.75rem;
    font-variant-numeric: tabular-nums;
  }
  .rs-cells { display: flex; flex-wrap: wrap; gap: 3px; flex: 1; }
  .rs-cells.rs-months { display: grid; grid-template-columns: repeat(12, minmax(1.75rem, 1fr)); }
  .rs-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 1.75rem;
    height: 1.75rem;
    padding: 0 2px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
    color: var(--pg-text-primary);
    border: 1px solid transparent;
    text-decoration: none;
    background: transparent;
  }
  .rs-cell.rs-none { border-color: var(--pg-border-subtle); color: var(--pg-text-dim); opacity: 0.45; }
  .rs-cell.rs-present { background: var(--rs-present); border-color: var(--rs-present-border); }
  .rs-cell.rs-extra { background: var(--rs-extra); border-color: var(--rs-extra-border); }
  .rs-cell.rs-gallery-only { background: var(--rs-gallery-only); border-color: var(--rs-gallery-only-border); }
  .rs-cell.rs-missing { background: var(--rs-missing); border-color: var(--rs-missing-border); cursor: pointer; font-weight: 700; }
  .rs-cell.rs-due { background: var(--rs-due); border-color: var(--rs-due-border); cursor: pointer; }
  .rs-cell.rs-upcoming { border: 1px dashed var(--pg-text-dim); color: var(--pg-text-secondary); }
  .rs-cell.rs-dismissed {
    background: repeating-linear-gradient(45deg, var(--rs-dismissed), var(--rs-dismissed) 4px, transparent 4px, transparent 8px);
    border-color: var(--pg-text-dim);
    color: var(--pg-text-secondary);
  }
  .rs-bar-archived { background: var(--rs-present-border); border-radius: 0; }
  .rs-bar-archived.rs-bar-partial { background: #ffc107; }
  .rs-bar-gallery-only { background: var(--rs-gallery-only-border); border-radius: 0; }
  .rs-text-gallery-only { color: var(--rs-gallery-only-border); }
  a.rs-cell:hover, button.rs-cell:hover { filter: brightness(1.35); color: #fff; }
  .rs-month-head { display: grid; grid-template-columns: repeat(12, minmax(1.75rem, 1fr)); gap: 3px; flex: 1; }
  .rs-month-head span { text-align: center; font-size: 0.7rem; color: var(--pg-text-dim); }
  .rs-legend { display: flex; flex-wrap: wrap; gap: 0.9rem; font-size: 0.78rem; color: var(--pg-text-secondary); }
  .rs-legend .rs-cell { display: inline-flex; min-width: 1rem; width: 1rem; height: 1rem; margin-right: 0.3rem; vertical-align: -3px; }
  .rs-window { border-top: 1px solid var(--pg-border-subtle); }
  .rs-window:first-child { border-top: 0; }
  .rs-window-single { padding-top: 0.4rem !important; padding-bottom: 0.4rem !important; }
  .rs-window-date { min-width: 6.5rem; font-variant-numeric: tabular-nums; }
  .rs-gap-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .rs-gap {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    background: var(--pg-bg-inset);
    border: 1px solid var(--pg-border-subtle);
    font-size: 0.82rem;
  }
  .rs-gap .form-check-input { margin: 0; }
  .rs-gap .rs-gap-date { color: var(--pg-text-dim); font-size: 0.75rem; }
  .rs-query { font-size: 0.75rem; word-break: break-all; }
  .rs-hit-title { max-width: 34rem; }
  .rs-schedule { white-space: pre; }
  #rs-backlog-results .table-dm td { font-size: 0.85rem; }
  @media (max-width: 576px) {
    .rs-row-label { flex-basis: 2.4rem; font-size: 0.7rem; }
    .rs-cells.rs-months, .rs-month-head { grid-template-columns: repeat(12, minmax(1.15rem, 1fr)); gap: 2px; }
    .rs-cell { min-width: 1.15rem; height: 1.45rem; font-size: 0.6rem; padding: 0; }
    .rs-row { gap: 4px; }
  }
</style>
